[package]
name = "spearcode-desktop"
version = "0.1.4"
description = "SpearCode desktop window (Tauri 2 + PTY)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "spearcode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
